name: sudoku

renderSettings:
  defaultScale: 36
  funcs:
    - edgearea
    - numhint
    - sudoku

inputs:
  boxes: true
  given_cells:
    type: num_36
    empty_value: 0

variables:
  - on: cells
    value: num_1_to_size
    required: true

constraints:
  - on: cell_lines, areas
    check:
      all_distinct: cells

name: norinori

renderSettings:
  defaultScale: 30
  funcs:
    - edgearea
    - binarygrey

inputs:
  areas: true

variables:
  required:
    - on: cells
      value: [0, 1]

constraints:
  - on: areas
    check:
      equals:
        - sum: cells
        - 2
  - on: cells
    check:
      if:
        - equals: [cell, 1]
        - equals:
            - sum: cell.adjacent_edge
            - 1

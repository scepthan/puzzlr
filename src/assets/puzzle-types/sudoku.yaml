name: sudoku

renderSettings:
  defaultScale: 36
  funcs:
    - edgearea
    - numhint
    - sudoku

inputs:
  boxes: true
  cell_givens:
    type: num_36
    empty_value: 0

variables:
  - on: cells
    value: num_1_to_size
    required: true

constraints:
  - on: [cell_lines, areas]
    check:
      contains_all: [cells, num_1_to_size]
